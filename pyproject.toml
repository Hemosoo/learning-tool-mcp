[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-tool-mcp"
version = "0.7.1"
description = "An MCP server that turns PDFs into flashcards and quizzes, with session tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12,<2",
    "pypdf>=4,<6",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.15,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
learning-tool-mcp = "learning_tool.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# The package is checked with --strict; tests and tools with these defaults.
# Two invocations rather than a per-module override, because per-module
# strictness also tightens the test files that import the package.
[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "tools"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]
